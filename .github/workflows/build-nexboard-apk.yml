name: Build NexBoard APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Delete old artifacts to free quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          for NAME in "NexBoard-debug-latest" "NexBoard-release-SIGNED-latest"; do
            IDS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/artifacts?name=$NAME&per_page=100" \
              | jq -r '.artifacts[].id')
            for ID in $IDS; do
              echo "Deleting artifact $ID ($NAME)"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$ID"
            done
          done
          # Also delete all older run-numbered artifacts to reclaim quota
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.name | startswith("NexBoard")) | .id' \
            | while read ID; do
              echo "Deleting legacy artifact $ID"
              curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$ID" || true
            done

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NexBoard-debug-latest
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          overwrite: true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "=== Release Certificate Fingerprints ==="
            keytool -list -v \
              -keystore app/release.keystore \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASSWORD" \
              -storetype PKCS12 2>/dev/null \
              | grep -E "SHA1|SHA256|MD5"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NexBoard-release-SIGNED-latest
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          overwrite: true

      - name: Print APK info
        if: always()
        run: |
          echo "=== NexBoard APK Build Summary ==="
          find app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            echo "  $f  ($(du -sh "$f" | cut -f1))"
          done || echo "No APKs found"
