name: Build NexBoard APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "=== Release Certificate Fingerprints ==="
            keytool -list -v \
              -keystore app/release.keystore \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASSWORD" \
              -storetype PKCS12 2>/dev/null \
              | grep -E "SHA1|SHA256|MD5"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Print APK info
        if: always()
        run: |
          echo "=== NexBoard APK Build Summary ==="
          find app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            echo "  $f  ($(du -sh "$f" | cut -f1))"
          done || echo "No APKs found"

      - name: Publish APKs to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-build"
          TITLE="NexBoard – Latest Build"
          NOTES="**Commit:** \`${{ github.sha }}\`
          **Built:** $(date -u '+%Y-%m-%d %H:%M UTC')
          **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Downloads
          - **app-debug.apk** – debug build, install directly (enable Unknown Sources)
          - **app-release.apk** – signed release build (if keystore is configured)"

          # Rename APKs to include build number for clarity
          cp app/build/outputs/apk/debug/app-debug.apk \
             app-debug-build${{ github.run_number }}.apk

          ASSETS="app-debug-build${{ github.run_number }}.apk"

          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               app-release-signed-build${{ github.run_number }}.apk
            ASSETS="$ASSETS app-release-signed-build${{ github.run_number }}.apk"
          fi

          # Delete existing latest-build release/tag and recreate fresh
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin --delete "$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            $ASSETS
