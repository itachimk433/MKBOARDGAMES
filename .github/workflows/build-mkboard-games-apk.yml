name: Build MK~Board Games APK + AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "=== Release Certificate Fingerprints ==="
            keytool -list -v \
              -keystore app/release.keystore \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASSWORD" \
              -storetype PKCS12 2>/dev/null \
              | grep -E "SHA1|SHA256|MD5"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Build signed release AAB (for Google Play)
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Print build outputs
        if: always()
        run: |
          echo "=== MK~Board Games Build Summary ==="
          echo "-- APKs --"
          find app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            echo "  $f  ($(du -sh "$f" | cut -f1))"
          done || echo "No APKs found"
          echo "-- AABs --"
          find app/build/outputs/bundle -name "*.aab" 2>/dev/null | while read f; do
            echo "  $f  ($(du -sh "$f" | cut -f1))"
          done || echo "No AABs found"

      - name: Publish builds to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-build"
          TITLE="MK~Board Games – Latest Build"
          NOTES="**Commit:** \`${{ github.sha }}\`
          **Built:** $(date -u '+%Y-%m-%d %H:%M UTC')
          **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Downloads
          - **app-debug.apk** – debug build, install directly (enable Unknown Sources)
          - **app-release.apk** – signed release APK (sideload/direct install)
          - **app-release.aab** – signed AAB for uploading to Google Play Console"

          cp app/build/outputs/apk/debug/app-debug.apk \
             app-debug-build${{ github.run_number }}.apk

          ASSETS="app-debug-build${{ github.run_number }}.apk"

          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               app-release-signed-build${{ github.run_number }}.apk
            cp app/build/outputs/bundle/release/app-release.aab \
               app-release-build${{ github.run_number }}.aab
            ASSETS="$ASSETS app-release-signed-build${{ github.run_number }}.apk app-release-build${{ github.run_number }}.aab"
          fi

          # Keep the rolling release idempotent. Try to edit the existing
          # release first; if it is missing, create it and upload the assets
          # in the same command so a newly-created release is immediately
          # available for the following operations.
          if gh release edit "$TAG" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease \
            --target "${{ github.sha }}" 2>/dev/null; then
            uploaded=false
            for attempt in 1 2 3; do
              if gh release upload "$TAG" \
                $ASSETS \
                --clobber; then
                uploaded=true
                break
              fi
              echo "Release upload attempt $attempt failed; retrying..."
              sleep 3
            done
            if [ "$uploaded" != "true" ]; then
              echo "Release upload failed after 3 attempts"
              exit 1
            fi
          else
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --target "${{ github.sha }}" \
              $ASSETS
          fi
