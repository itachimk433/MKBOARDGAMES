name: Build MK BOARD GAMES APK + AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set monotonically increasing app version
        run: |
          VERSION_CODE=$((25 + GITHUB_RUN_NUMBER))
          VERSION_NAME="2.5.${GITHUB_RUN_NUMBER}"
          {
            echo "APP_VERSION_CODE=$VERSION_CODE"
            echo "APP_VERSION_NAME=$VERSION_NAME"
          } >> "$GITHUB_ENV"
          echo "App version: $VERSION_NAME ($VERSION_CODE)"

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          # The action's historical default includes the removed SDK package
          # named "tools", which makes current GitHub runners fail before the
          # workflow reaches the NDK build.
          packages: platform-tools

      - name: Build compact Ethereal chess engines
        env:
          ETHEREAL_COMMIT: 0e47e9b67f345c75eb965d9fb3e2493b6a11d09a
          NDK_VERSION: 27.2.12479018
        run: |
          set -euo pipefail

          sdkmanager "ndk;${NDK_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK="${SDK_ROOT}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SOURCE="${RUNNER_TEMP}/ethereal"
          ASSET_ROOT="app/src/main/assets/ethereal"

          git clone --depth 1 https://github.com/AndyGrant/Ethereal.git "$SOURCE"
          git -C "$SOURCE" fetch --depth 1 origin "$ETHEREAL_COMMIT"
          git -C "$SOURCE" checkout --detach "$ETHEREAL_COMMIT"

          build_engine() {
            local abi="$1"
            local compiler="$2"
            local extra_flags="${3:-}"
            local output="${RUNNER_TEMP}/ethereal-${abi}"

            # Ethereal's default build uses its compact public PK network,
            # compiled into network.c, so no separate model asset ships.
            # Keep this a plain NDK clang invocation instead of using
            # -march=native, which would target the GitHub runner.
            "$TOOLCHAIN/${compiler}" \
              -std=gnu11 \
              -O3 \
              -DNDEBUG \
              -DUSE_NNUE=0 \
              -ffunction-sections \
              -fdata-sections \
              -flto \
              -fuse-ld=lld \
              -Wl,--gc-sections \
              -Wl,--strip-all \
              ${extra_flags} \
              -I"$SOURCE/src" \
              -I"$SOURCE/src/pyrrhic" \
              "$SOURCE"/src/*.c \
              "$SOURCE"/src/pyrrhic/tbprobe.c \
              -lm \
              -pthread \
              -o "$output"

            mkdir -p "$ASSET_ROOT/$abi"
            install -m 0755 "$output" "$ASSET_ROOT/$abi/ethereal"
            echo "$abi engine: $(du -h "$output" | cut -f1)"
          }

          build_engine arm64-v8a aarch64-linux-android24-clang
          build_engine armeabi-v7a armv7a-linux-androideabi24-clang "-mthumb -march=armv7-a -mfpu=neon -mfloat-abi=softfp"

      - name: Build compact Stockfish small-NNUE engines
        env:
          STOCKFISH_COMMIT: cb4a62311985f685ba6f5457851527a3289073e6
          STOCKFISH_NETWORK: nn-37f18f62d772.nnue
          STOCKFISH_NETWORK_SHA256: 37f18f62d772f3107e1d6aaca3898c130c3c86f2ab63e6555fbbca20635a899d
          NDK_VERSION: 27.2.12479018
        run: |
          set -euo pipefail

          sdkmanager "ndk;${NDK_VERSION}"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK="${SDK_ROOT}/ndk/${NDK_VERSION}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SOURCE="${RUNNER_TEMP}/stockfish"
          ASSET_ROOT="app/src/main/assets/stockfish"
          NETWORK_URL="https://raw.githubusercontent.com/official-stockfish/networks/master/${STOCKFISH_NETWORK}"

          git clone --depth 1 https://github.com/official-stockfish/Stockfish.git "$SOURCE"
          git -C "$SOURCE" fetch --depth 1 origin "$STOCKFISH_COMMIT"
          git -C "$SOURCE" checkout --detach "$STOCKFISH_COMMIT"

          # This revision has both Stockfish's large and small NNUE paths.
          # Use the compact small network for both paths and disable embedded
          # network data, so the 3.5 MB asset is shared by both ABIs instead
          # of embedding a second, unused network in each executable.
          python3 - "$SOURCE/src/evaluate.h" "$SOURCE/src/nnue/nnue_architecture.h" <<'PY'
          from pathlib import Path
          import sys

          evaluate = Path(sys.argv[1])
          text = evaluate.read_text()
          old = '#define EvalFileDefaultNameBig "nn-ddcfb9224cdb.nnue"'
          if old not in text:
              raise SystemExit("unexpected Stockfish default big-network name")
          text = text.replace(old, '#define EvalFileDefaultNameBig "nn-37f18f62d772.nnue"')
          evaluate.write_text(text)

          architecture = Path(sys.argv[2])
          text = architecture.read_text()
          old = 'constexpr IndexType TransformedFeatureDimensionsBig = 3072;'
          if old not in text:
              raise SystemExit("unexpected Stockfish big-network dimensions")
          text = text.replace(old, 'constexpr IndexType TransformedFeatureDimensionsBig = 128;')
          architecture.write_text(text)
          PY

          curl --fail --silent --show-error --location --retry 3 \
            "$NETWORK_URL" \
            --output "$SOURCE/src/$STOCKFISH_NETWORK"
          echo "${STOCKFISH_NETWORK_SHA256}  $SOURCE/src/$STOCKFISH_NETWORK" \
            | sha256sum --check --status

          build_stockfish() {
            local abi="$1"
            local arch="$2"
            local compiler="$3"
            local output="${RUNNER_TEMP}/stockfish-${abi}"

            make -C "$SOURCE/src" clean >/dev/null
            make -C "$SOURCE/src" -j2 build \
              ARCH="$arch" \
              COMP=ndk \
              CXX="$TOOLCHAIN/$compiler" \
              EXTRACXXFLAGS="-DNNUE_EMBEDDING_OFF"

            install -m 0755 "$SOURCE/src/stockfish" "$output"
            mkdir -p "$ASSET_ROOT/$abi"
            install -m 0755 "$output" "$ASSET_ROOT/$abi/stockfish"
            echo "$abi Stockfish engine: $(du -h "$output" | cut -f1)"
          }

          build_stockfish arm64-v8a armv8 aarch64-linux-android24-clang++
          build_stockfish armeabi-v7a armv7-neon armv7a-linux-androideabi24-clang++

          install -m 0644 "$SOURCE/src/$STOCKFISH_NETWORK" \
            "$ASSET_ROOT/$STOCKFISH_NETWORK"
          echo "shared Stockfish network: $(du -h "$ASSET_ROOT/$STOCKFISH_NETWORK" | cut -f1)"

          total_bytes="$(du -cb \
            "$ASSET_ROOT/$STOCKFISH_NETWORK" \
            "$ASSET_ROOT/arm64-v8a/stockfish" \
            "$ASSET_ROOT/armeabi-v7a/stockfish" | tail -1 | cut -f1)"
          test "$total_bytes" -lt 10000000
          echo "Stockfish assets total: ${total_bytes} bytes (< 10 MB)"

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
            echo "=== Release Certificate Fingerprints ==="
            keytool -list -v \
              -keystore app/release.keystore \
              -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASSWORD" \
              -storetype PKCS12 2>/dev/null \
              | grep -E "SHA1|SHA256|MD5"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Build signed release AAB (for Google Play)
        if: env.HAS_KEYSTORE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            --no-daemon \
            --no-build-cache \
            --stacktrace

      - name: Print build outputs
        if: always()
        run: |
          echo "=== MK BOARD GAMES Build Summary ==="
          echo "-- APKs --"
          find app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            echo "  $f  ($(du -sh "$f" | cut -f1))"
          done || echo "No APKs found"
          echo "-- AABs --"
          find app/build/outputs/bundle -name "*.aab" 2>/dev/null | while read f; do
            echo "  $f  ($(du -sh "$f" | cut -f1))"
          done || echo "No AABs found"

      - name: Publish builds to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-build"
          TITLE="MK BOARD GAMES – Latest Build"
          NOTES="**Commit:** \`${{ github.sha }}\`
          **Built:** $(date -u '+%Y-%m-%d %H:%M UTC')
          **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Downloads
          - **app-debug.apk** – debug build, install directly (enable Unknown Sources)
          - **app-release.apk** – signed release APK (sideload/direct install)
          - **app-release.aab** – signed AAB for uploading to Google Play Console"

          cp app/build/outputs/apk/debug/app-debug.apk \
             app-debug-build${{ github.run_number }}.apk

          ASSETS="app-debug-build${{ github.run_number }}.apk"

          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               app-release-signed-build${{ github.run_number }}.apk
            cp app/build/outputs/bundle/release/app-release.aab \
               app-release-build${{ github.run_number }}.aab
            ASSETS="$ASSETS app-release-signed-build${{ github.run_number }}.apk app-release-build${{ github.run_number }}.aab"
          fi

          # Keep the rolling release idempotent. A published release cannot
          # move its tag to another commit, so update the existing release
          # metadata without passing --target. Only new releases are created
          # with the current commit as their target.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG without retargeting it"
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --draft=false
          else
            echo "Creating release $TAG at ${{ github.sha }}"
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --draft=false \
              --target "${{ github.sha }}"
          fi

          # Upload separately so both existing and newly-created releases
          # receive the current run's build outputs.
          uploaded=false
          for attempt in 1 2 3; do
            if gh release upload "$TAG" \
              $ASSETS \
              --clobber; then
              uploaded=true
              break
            fi
            echo "Release upload attempt $attempt failed; retrying..."
            sleep 3
          done
          if [ "$uploaded" != "true" ]; then
            echo "Release upload failed after 3 attempts"
            exit 1
          fi